name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      frontend: ${{ steps.diff.outputs.frontend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diff changed areas
        id: diff
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          emit() { echo "backend=$1" >> "$GITHUB_OUTPUT"; echo "frontend=$2" >> "$GITHUB_OUTPUT"; echo "backend=$1 frontend=$2"; }

          # Manual runs, new branches and unknown bases check everything.
          if [ "$EVENT_NAME" = workflow_dispatch ] || [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            emit true true; exit 0
          fi

          files=$(git diff --name-only "$BASE_SHA...$HEAD_SHA")
          # Files that affect the bundled build of both areas.
          if grep -qE '^(Dockerfile|docker-compose\.yml|\.dockerignore|\.github/workflows/(ci|deploy-dev)\.yml)$' <<<"$files"; then
            emit true true; exit 0
          fi

          backend=false; frontend=false
          if grep -q '^backend/' <<<"$files"; then backend=true; fi
          if grep -q '^frontend/' <<<"$files"; then frontend=true; fi
          emit "$backend" "$frontend"

  backend:
    name: Backend test
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle*
            backend/gradle/wrapper/gradle-wrapper.properties

      - name: Run tests
        run: ./gradlew clean test

  frontend:
    name: Frontend build
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: corepack enable && pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Build
        env:
          # Must be defined for index.html; empty means the app is served from "/".
          VITE_PUBLIC_URL: ""
        run: pnpm build

  e2e:
    name: Frontend E2E
    needs: [changes, frontend]
    # Requires Actions secrets for the test backend; enable with the E2E_ENABLED repository variable.
    if: >-
      needs.changes.outputs.frontend == 'true' && vars.E2E_ENABLED == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    env:
      CI: true
      NODE_ENV: ${{ secrets.NODE_ENV }}
      VITE_BACK_BASE_URL: ${{ secrets.VITE_BACK_BASE_URL }}
      VITE_PUBLIC_URL: ${{ secrets.VITE_PUBLIC_URL }}
      E2E_USER_SUB: test1
      E2E_MEMBER_SUB: test2
      E2E_ADMIN_SUB: test3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: corepack enable && pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright tests
        run: pnpm exec playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30

  result:
    name: CI result
    # Always reports a status so it can be used as the single required check.
    if: always()
    needs: [changes, backend, frontend, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

      - name: All required jobs passed or were skipped
        run: echo "ok"

  deploy-dev:
    name: Deploy dev
    # Only pushes to main that touch an area (or the shared build files) redeploy;
    # docs-only changes skip it. The explicit result check is required: without a
    # status function, a skipped upstream job (e.g. E2E) would skip this job too.
    needs: [changes, result]
    if: >-
      !cancelled() && needs.result.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true')
    uses: ./.github/workflows/deploy-dev.yml
    secrets: inherit
